<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuya Kelvin's CalX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #303032;
            background-image: url('POGERS.png');
            background-position: left;
            background-repeat: no-repeat;
            background-size: contain;
        }
        .calculator-container {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            height: 100vh;
        }
        .card {
            width: 700px;
        }
    </style>
</head>
<body>
    <div class="container calculator-container">
        <div class="card p-4 shadow-sm bg-dark text-white">
            <h2 class="mb-4 text-center">Greetings, I am <span class="text-info">Kuya Kelvin,</span> shall we test your knowledge?</h2>
            <form>
                <div class="mb-3">
                    <label class="form-label">Enter a value for <b>a</b>:</label>
                    <input type="number" id="num1" class="form-control" placeholder="Insert value..">
                </div>
                <div class="mb-3">
                    <label class="form-label">Enter a value for <b>b</b>:</label>
                    <input type="number" id="num2" class="form-control" placeholder="Insert value..">
                </div>
                <button type="button" class="btn btn-success" onclick="multiply()">Product of a and b</button>
                <button type="button" class="btn btn-warning" onclick="exp()">a raise to b</button>
                <button type="button" class="btn btn-danger" onclick="getR()">Get the remainder</button>
                <button type="button" class="btn btn-primary" onclick="checkEQ()">Check if a is equal to b</button>
            </form> <br>
             <details ontoggle="message()">
            <summary>Click here</summary>
            <i><h3 class="mt-4 text-center" id="ANS">Answer</h3></i>
        </details>
            
        </div>
    </div>
    
    <script>
function message() {
            alert("View?");
        }

        function multiply() {
            var num1 = document.getElementById('num1').value;
            var num2 = document.getElementById('num2').value;
            var product = Number(num1) * Number(num2);
            document.getElementById("ANS").innerHTML = 'Answer is ' + product;
        }

        function exp() {
            var num1 = document.getElementById('num1').value;
            var num2 = document.getElementById('num2').value;
            var result = Math.pow(Number(num1), Number(num2));
            document.getElementById("ANS").innerHTML = 'Answer is ' + result;
        }

        function getR() {
            var num1 = document.getElementById('num1').value;
            var num2 = document.getElementById('num2').value;
            var remainder = Number(num1) % Number(num2);
            document.getElementById("ANS").innerHTML = 'Answer is ' + remainder;
        }

        function checkEQ() {
            var num1 = document.getElementById('num1').value;
            var num2 = document.getElementById('num2').value;
            var isEqual = Number(num1) === Number(num2) ? "Equal" : "Not Equal";
            document.getElementById("ANS").innerHTML = 'Answer is ' + isEqual;
        }
    </script>
</body>
</html>
